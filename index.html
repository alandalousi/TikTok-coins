
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TikTok Coins</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .header {
      background: #fff;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: bold;
      font-size: 18px;
      border-bottom: 1px solid #ddd;
    }

    .container {
      padding: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .card {
      background: #fff;
      padding: 15px;
      border-radius: 15px;
      text-align: center;
      border: 1px solid #eee;
      cursor: pointer;
      transition: 0.2s;
    }

    .card.active {
      border: 2px solid #fe2c55;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #fe2c55;
      color: #fff;
      border: none;
      border-radius: 12px;
      margin-top: 20px;
      font-size: 16px;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal {
      background: #fff;
      padding: 25px;
      border-radius: 20px;
      width: 85%;
      text-align: center;
      animation: scaleIn 0.3s ease;
    }

    .check {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #00c853;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      margin: 0 auto;
    }

    @keyframes scaleIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>

<!-- Header -->
<div class="header">
  <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/TikTok_logo.svg" width="28">
  TikTok
</div>

<!-- Content -->
<div class="container">
  <input id="user" placeholder="Enter TikTok username"/>

  <div class="grid" id="coins"></div>

  <button onclick="pay()">Pay Now</button>
</div>

<!-- Success Modal -->
<div id="success" style="display:none;" class="overlay">
  <div class="modal">
    <div class="check">✔</div>
    <h2>Payment Successful</h2>
    <p id="result"></p>
    <button onclick="closeModal()">Done</button>
  </div>
</div>

<script>
let selected = 200;
const coins = [30, 40, 50, 70, 150, 200];
const grid = document.getElementById("coins");

coins.forEach(c => {
  let div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `<h3>${c}</h3><p>$${(c * 0.01).toFixed(2)}</p>`;

  div.onclick = () => {
    selected = c;
    document.querySelectorAll(".card").forEach(e => e.classList.remove("active"));
    div.classList.add("active");
  };

  if (c === 200) div.classList.add("active");
  grid.appendChild(div);
});

function pay() {
  let user = document.getElementById("user").value || "username";
  document.getElementById("result").innerText =
    selected + " coins sent to @" + user;

  document.getElementById("success").style.display = "flex";
}

function closeModal() {
  document.getElementById("success").style.display = "none";
}
</script>

</body>
</html>
