<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coins Shop</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
}

/* FIX PC */
.container{
  max-width:100%;
  margin:auto;
  padding:15px;
}

/* PC layout */
@media (min-width:768px){
  .container{
    max-width:900px;
    padding:25px;
  }

  .grid{
    grid-template-columns:repeat(3,1fr);
    gap:20px;
  }

  .card{
    padding:22px;
    font-size:18px;
  }

  button{
    font-size:18px;
    padding:16px;
  }
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.secure{
  text-align:center;
  color:#aaa;
  font-size:14px;
  margin-bottom:15px;
}

.username-input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-bottom:15px;
  background:#1a1a1a;
  color:white;
  box-sizing:border-box;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.card{
  background:#1a1a1a;
  padding:18px;
  border-radius:14px;
  text-align:center;
  cursor:pointer;
  border:2px solid transparent;
  transition:0.2s;
}

.card.active{
  border:2px solid #ff2d55;
  transform:scale(1.03);
}

.price{
  margin-top:6px;
  color:#aaa;
}

.custom-card input{
  width:100%;
  margin-top:10px;
  padding:10px;
  border-radius:8px;
  border:none;
  background:#333;
  color:white;
  text-align:center;
  box-sizing:border-box;
}

.payments{
  margin-top:25px;
}

.pay{
  background:#1a1a1a;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  cursor:pointer;
  border:2px solid transparent;
  display:flex;
  align-items:center;
  gap:10px;
}

.pay.active{
  border:2px solid #ff2d55;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#ff2d55;
  color:white;
  font-size:16px;
  margin-top:20px;
  cursor:pointer;
}

/* LOADING */
.loading{
  display:none;
  text-align:center;
  margin-top:100px;
}

.spinner{
  border:6px solid #333;
  border-top:6px solid #ff2d55;
  border-radius:50%;
  width:60px;
  height:60px;
  animation:spin 1s linear infinite;
  margin:auto;
}

@keyframes spin{
  100%{ transform:rotate(360deg); }
}

/* SUCCESS */
.success{
  display:none;
  text-align:center;
  margin-top:100px;
}

.success i{
  font-size:60px;
  color:#00d26a;
}
</style>
</head>

<body>

<div class="container" id="main">

  <div class="top">
    <div style="display:flex; align-items:center; gap:8px; font-weight:bold;">
      <i class="fa-brands fa-tiktok"></i>
      TikTok Coins
    </div>

    <div style="display:flex; gap:12px;">
      <i class="fa-regular fa-file-lines"></i>
      <i class="fa-regular fa-circle-question"></i>
    </div>
  </div>

  <div class="secure">
    <i class="fa-solid fa-shield-halved"></i> Secure payment
  </div>

  <input class="username-input" id="username" type="text" placeholder="Enter username">

  <div class="grid">
    <div class="card" onclick="selectCoin(this,70)">🪙 70<div class="price">$1.12</div></div>
    <div class="card" onclick="selectCoin(this,350)">🪙 350<div class="price">$5.60</div></div>
    <div class="card" onclick="selectCoin(this,700)">🪙 700<div class="price">$11.20</div></div>
    <div class="card" onclick="selectCoin(this,1400)">🪙 1400<div class="price">$22.40</div></div>

    <div class="card custom-card" onclick="activateCustom(this)">
      🪙 Custom
      <input type="number" placeholder="Enter coins" oninput="customCoins(this.value)">
      <div class="price" id="customPrice"></div>
    </div>
  </div>

  <div class="payments">
    <div class="pay" onclick="selectPay(this)">
      <i class="fa-brands fa-cc-visa"></i> Visa
    </div>

    <div class="pay" onclick="selectPay(this)">
      <i class="fa-brands fa-cc-mastercard"></i> MasterCard
    </div>

    <div class="pay" onclick="selectPay(this)">
      <i class="fa-brands fa-paypal"></i> PayPal
    </div>
  </div>

  <button onclick="payNow()">Recharge</button>

</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <p id="loadingText">Checking payment...</p>
</div>

<div class="success" id="success">
  <i class="fa-solid fa-circle-check"></i>
  <h2>Payment Successful</h2>
  <button onclick="goHome()">Back to Home</button>
</div>

<script>
let selectedCoin = 0;

function selectCoin(el,val){
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  selectedCoin = val;
}

function activateCustom(el){
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
}

function customCoins(val){
  selectedCoin = val;
  let price = (val * 0.016).toFixed(2);
  document.getElementById("customPrice").innerText = "$" + price;
}

function selectPay(el){
  document.querySelectorAll('.pay').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
}

function payNow(){
  let username = document.getElementById("username").value;

  if(!username){
    alert("Enter username first");
    return;
  }

  document.getElementById("main").style.display="none";
  document.getElementById("loading").style.display="block";

  let steps = [
    "Checking payment...",
    "Processing transaction...",
    "Verifying details...",
    "Finalizing..."
  ];

  let i = 0;

  let interval = setInterval(()=>{
    document.getElementById("loadingText").innerText = steps[i];
    i++;
    if(i >= steps.length){
      clearInterval(interval);
    }
  },1200);

  setTimeout(()=>{
    document.getElementById("loading").style.display="none";
    document.getElementById("success").style.display="block";
  },5000);
}

function goHome(){
  document.getElementById("success").style.display="none";
  document.getElementById("main").style.display="block";
}
</script>

</body>
</html>
